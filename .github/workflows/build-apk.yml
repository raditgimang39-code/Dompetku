name: Build DompetKu APK


name: Build DompetKu APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract and build APK
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -1)
          mkdir project
          unzip -q "$ZIP" -d project
          PROJECT_DIR=$(find project -name settings.gradle -printf '%h\n' | head -1)
          cd "$PROJECT_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/DompetKu.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DompetKu-APK
          path: out/DompetKu.apk
